name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Required Secrets
        run: |
          MISSING_SECRETS=false
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN is not set."
            MISSING_SECRETS=true
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Error: SUPABASE_PROJECT_ID is not set."
            MISSING_SECRETS=true
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Error: SUPABASE_DB_PASSWORD is not set."
            MISSING_SECRETS=true
          fi
          if [ "$MISSING_SECRETS" = "true" ]; then
            echo ""
            echo "====================================================================="
            echo "One or more required secrets are missing!"
            echo "Please configure the following as Repository Secrets in GitHub:"
            echo "(Settings -> Secrets and variables -> Actions)"
            echo "  - SUPABASE_ACCESS_TOKEN: Your Supabase Personal Access Token."
            echo "  - SUPABASE_PROJECT_ID: Your Supabase Project Reference ID."
            echo "  - SUPABASE_DB_PASSWORD: Your Supabase Database Password."
            echo "====================================================================="
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link Supabase Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD

      - name: Push Migrations to Supabase DB
        run: supabase db push --password $SUPABASE_DB_PASSWORD
